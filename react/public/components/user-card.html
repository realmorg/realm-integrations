<import-element from="https://realm.js.org/dist/ui/components/badge.html"></import-element>

<custom-element name="user-card">
  <script>
    defineProps({
      name: prop.string(),
      plan: prop.string().default("Free"),
    });
  </script>

  <style>
    :host {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: calc(var(--spacing) * 3);
      padding: calc(var(--spacing) * 4);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--card);
      color: var(--card-foreground);
    }
    strong {
      font-weight: var(--font-weight-semibold);
    }
  </style>

  <strong><slot name="@name"></slot></strong>
  <ui-badge variant="secondary"><slot name="@plan"></slot></ui-badge>
</custom-element>
